# Team runs added to the dashboard as DEM variants (build_team.py). Paths are relative to ${REPEAT_KHG}/from_team/.
# Each variant is a whole-KHG run of the earlier method: every sub-KHG processed, own sub-KHG polygons, no prioritisation tables.
# A variant key is <dem>_full. The layer files map a dashboard layer id to {path, layer}; a layer without a file is not shown.
# dem_basis says how the DEM was identified: "named" when the delivery names it, "cell size" when it is inferred from the cell size.

variants:
  demnas_full: {en: "DEMNAS (full sub-KHG)", id: "DEMNAS (seluruh sub-KHG)"}
  lidar_full: {en: "LiDAR (full sub-KHG)", id: "LiDAR (seluruh sub-KHG)"}
  worlddem_full: {en: "WorldDEM 12 m (full sub-KHG)", id: "WorldDEM 12 m (seluruh sub-KHG)"}
  brgmcontour_full: {en: "BRGM contour DTM (full sub-KHG)", id: "DTM kontur BRGM (seluruh sub-KHG)"}

khg:
  "15-16.01":    # Air Hitam Laut - Buntu Kecil
    lidar_full:
      dtm: "KHG Air Hitam Laut - Buntu Kecil/dem_lidar_25m.tif"
      units: {path: "KHG Air Hitam Laut - Buntu Kecil/batas_subkhg.gpkg", layer: subkhg_prioritas}
      sekat_proposed: {path: "KHG Air Hitam Laut - Buntu Kecil/sekat.gpkg", layer: sekat_terpilih}
      dem_basis: named
  "15.05-07-10.01":    # Mendahara - Batanghari
    lidar_full:
      dtm: "KHG Mendahara - Batanghari/dem_lidar_25m.tif"
      units: {path: "KHG Mendahara - Batanghari/batas_subkhg.gpkg"}
      sekat_proposed: {path: "KHG Mendahara - Batanghari/sekat.gpkg", layer: sekat_terpilih}
      dem_basis: named
  "61.12-71.01":    # Pungurbesar - Kapuas
    demnas_full:
      dtm: "KHG Punggurbesar-Kapuas DEMNAS/dem_demnas_30m.tif"
      units: {path: "KHG Punggurbesar-Kapuas DEMNAS/batas_subkhg.gpkg"}
      sekat_proposed: {path: "KHG Punggurbesar-Kapuas DEMNAS/sekat.gpkg", layer: sekat_terpilih}
      dem_basis: named
    lidar_full:
