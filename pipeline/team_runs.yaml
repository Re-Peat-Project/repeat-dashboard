      sekat_proposed: {path: "KHG Punggurbesar-Kapuas LiDAR/sekat.gpkg", layer: sekat_terpilih}
      dem_basis: named
  "14.03.02":    # Pulau Bengkalis
    worlddem_full:
      dtm: "KHG BENGKALIS/DTM_BENGKALIS_WD.tif"
      units: {path: "KHG BENGKALIS/pump_run.gpkg", layer: subkhg_selected}
      sekat_proposed: {path: "KHG BENGKALIS/pump_run.gpkg", layer: sekat_proposed}
      sekat_existing: {path: "KHG BENGKALIS/pump_run.gpkg", layer: sekat_existing_assessed}
      canal_segments: {path: "KHG BENGKALIS/pump_run.gpkg", layer: canal_segments}
